<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ritmo: reproductor con la API de Deezer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--hoja:#EDEFF7;--tinta:#0E1030;--azul:#2630E8;--sol:#FFC933;--linea:#C9CDE3;--blanco:#fff}
*{box-sizing:border-box}
body{margin:0;padding-bottom:104px;background:var(--hoja);color:var(--tinta);font:16px/1.45 "Bricolage Grotesque",system-ui,sans-serif}
img{display:block;border-radius:4px;background:var(--linea);object-fit:cover}
button,input{font:inherit}
button{cursor:pointer}
.pagina{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:48px;max-width:1080px;margin:0 auto;padding:40px 24px}
h1{margin:0 0 8px;font-size:clamp(3rem,8vw,4.5rem);line-height:.9;font-weight:800;letter-spacing:-.04em;color:var(--azul)}
h2{margin:0 0 4px;font-size:1.5rem}
.lema{margin:0 0 24px;max-width:28ch}
#buscador{display:flex;gap:8px}
#q{flex:1;min-width:0;padding:12px 14px;border:2px solid var(--tinta);border-radius:6px;background:var(--blanco)}
.buscar{padding:0 18px;border:0;border-radius:6px;background:var(--tinta);color:var(--blanco);font-weight:700}
details{margin-top:28px;padding-top:12px;border-top:2px solid var(--tinta)}
summary{cursor:pointer;font-weight:700}
pre{max-height:340px;overflow:auto;margin:12px 0 0;padding:12px;border-radius:6px;background:var(--tinta);color:#DDE1FF;font-size:.78rem;white-space:pre-wrap;word-break:break-word}
#estado{min-height:1.5em;margin:0 0 8px;color:#B3261E}
ol{margin:0;padding:0;list-style:none}
li{border-top:1px solid var(--linea)}
.fila{display:grid;grid-template-columns:40px 56px 1fr auto;align-items:center;gap:14px;width:100%;padding:10px 8px;border:0;background:none;color:inherit;text-align:left}
.fila:disabled{opacity:.4;cursor:not-allowed}
.num{font-size:1.7rem;font-weight:800;text-align:right;color:var(--azul)}
.texto{display:flex;flex-direction:column;min-width:0}
.texto strong,.texto span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.activa .fila{border-radius:6px;background:var(--azul);color:var(--blanco)}
.activa .num{color:var(--sol)}
.reproductor{position:fixed;inset:auto 0 0 0;display:grid;grid-template-columns:56px minmax(120px,240px) 48px 1fr auto;align-items:center;gap:16px;padding:12px 24px;background:var(--azul);color:var(--blanco)}
#pp{width:48px;height:48px;border:0;border-radius:50%;background:var(--sol);color:var(--tinta);font-weight:800}
#barra{width:100%;accent-color:var(--sol)}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.reproductor :focus-visible,.activa :focus-visible{outline-color:var(--sol)}
@media(max-width:720px){.pagina{grid-template-columns:1fr;gap:28px}.reproductor{grid-template-columns:56px 1fr 48px;padding:12px 16px}#barra,#tiempo{grid-column:1/-1}body{padding-bottom:150px}}
</style>
</head>
<body>
<main class="pagina">
  <section>
    <h1>Ritmo</h1>
    <p class="lema">Busca una canción y escucha un fragmento de 30 segundos.</p>
    <form id="buscador" role="search">
      <input id="q" type="search" placeholder="Artista o canción" aria-label="Buscar canciones" required>
      <button class="buscar" type="submit">Buscar</button>
    </form>
    <details>
      <summary>Ver respuesta JSON</summary>
      <pre id="json">Aún no hay datos.</pre>
    </details>
  </section>
  <section>
    <h2 id="titulo-lista">Top global</h2>
    <p id="estado" role="status"></p>
    <ol id="lista"></ol>
  </section>
</main>

<footer class="reproductor">
  <img id="p-portada" alt="" width="56" height="56">
  <div class="texto"><strong id="p-titulo">Elige una canción</strong><span id="p-artista">&nbsp;</span></div>
  <button id="pp" type="button" aria-label="Reproducir">▶</button>
  <input id="barra" type="range" min="0" max="30" step="0.1" value="0" aria-label="Progreso">
  <span id="tiempo">0:00</span>
  <audio id="audio"></audio>
</footer>

<script>
const $ = (s) => document.querySelector(s);
const audio = $('#audio'), lista = $('#lista'), estado = $('#estado');
let canciones = [], actual = -1;

const el = (etiqueta, clase, texto) => {
  const e = document.createElement(etiqueta);
  if (clase) e.className = clase;
  if (texto !== undefined) e.textContent = texto;
  return e;
};
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

// Pide el JSON a NUESTRO Back End (no a Deezer directamente) y lo muestra.
async function cargar(url, titulo) {
  estado.textContent = 'Cargando…';
  try {
    const respuesta = await fetch(url);
    const datos = await respuesta.json();
    $('#json').textContent = JSON.stringify(datos, null, 2);
    if (!respuesta.ok) throw new Error(datos.error || `Error ${respuesta.status}`);
    canciones = datos;
    actual = -1;
    $('#titulo-lista').textContent = titulo;
    estado.textContent = datos.length ? '' : 'No encontramos canciones. Prueba con otro artista o título.';
  } catch (error) {
    canciones = [];
    estado.textContent = `No se pudo cargar la música: ${error.message}`;
  }
  pintar();
}

function pintar() {
  lista.replaceChildren(...canciones.map((c, i) => {
    const fila = el('button', 'fila');
    fila.type = 'button';
    fila.disabled = !c.preview;
    fila.setAttribute('aria-label', `Reproducir ${c.titulo} de ${c.artista}`);
    const portada = el('img');
    if (c.portada) portada.src = c.portada;
    portada.alt = '';
    portada.width = portada.height = 56;
    portada.loading = 'lazy';
    const texto = el('span', 'texto');
    texto.append(el('strong', '', c.titulo), el('span', '', c.artista));
    fila.append(el('span', 'num', i + 1), portada, texto, el('span', '', mmss(c.duracion)));
    fila.onclick = () => reproducir(i);
    const item = el('li', i === actual ? 'activa' : '');
    item.append(fila);
    return item;
  }));
}

function reproducir(i) {
  actual = i;
  const c = canciones[i];
  audio.src = c.preview;
  audio.play().catch(() => { estado.textContent = 'El navegador bloqueó la reproducción. Pulsa ▶ para continuar.'; });
  if (c.portada) $('#p-portada').src = c.portada;
  $('#p-titulo').textContent = c.titulo;
  $('#p-artista').textContent = c.artista;
  pintar();
}

$('#pp').onclick = () => { if (audio.src) audio.paused ? audio.play() : audio.pause(); };
audio.onplay = () => { $('#pp').textContent = '❚❚'; $('#pp').setAttribute('aria-label', 'Pausar'); };
audio.onpause = () => { $('#pp').textContent = '▶'; $('#pp').setAttribute('aria-label', 'Reproducir'); };
audio.ontimeupdate = () => { $('#barra').value = audio.currentTime; $('#tiempo').textContent = mmss(audio.currentTime); };
audio.onended = () => {
  const siguiente = canciones.findIndex((c, i) => i > actual && c.preview);
  if (actual >= 0 && siguiente !== -1) reproducir(siguiente);
};
$('#barra').oninput = (e) => { audio.currentTime = e.target.value; };
$('#buscador').onsubmit = (e) => {
  e.preventDefault();
  const q = $('#q').value.trim();
  if (q) cargar(`/api/canciones?q=${encodeURIComponent(q)}`, `Resultados para “${q}”`);
};

cargar('/api/canciones/top', 'Top global');
</script>
</body>
</html>
